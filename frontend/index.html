<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nissan Image Extractor</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }
    body {
      background: #f4f4f4;
      margin: 0;
      padding: 40px 20px;
      color: #1a1a1a;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
    }
    h1 {
      color: #c3002f;
      font-size: 24px;
      margin-top: 0;
    }
    p.intro {
      color: #555;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      margin: 12px 0;
    }
    input:focus {
      outline: none;
      border-color: #c3002f;
    }
    button {
      background: #c3002f;
      color: #fff;
      border: none;
      padding: 14px 28px;
      font-size: 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover {
      background: #a00026;
    }
    button:disabled {
      background: #999;
      cursor: not-allowed;
    }
    .section {
      margin-top: 24px;
    }
    .section h3 {
      border-bottom: 2px solid #eee;
      padding-bottom: 8px;
      color: #333;
    }
    .img-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      background: #fafafa;
      border-radius: 6px;
      margin: 6px 0;
      font-size: 13px;
      word-break: break-all;
      gap: 10px;
    }
    .img-item a {
      color: #0066cc;
      text-decoration: none;
      flex: 1;
    }
    .img-item a:hover {
      text-decoration: underline;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .copy-btn {
      background: #333;
      padding: 8px 14px;
      font-size: 12px;
    }
    .copy-btn:hover {
      background: #000;
    }
    .status {
      margin-top: 16px;
      font-style: italic;
      color: #666;
      min-height: 20px;
    }
    .status.error {
      color: #c3002f;
      font-weight: 600;
      font-style: normal;
    }
    .status.success {
      color: #2e7d32;
      font-weight: 600;
      font-style: normal;
    }
    .copy-all {
      background: #0066cc;
      margin-top: 12px;
      margin-bottom: 4px;
    }
    .copy-all:hover {
      background: #004fa3;
    }
    .empty {
      color: #999;
      font-style: italic;
      padding: 8px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚗 Nissan Image Extractor</h1>
    <p class="intro">
      Zalijepi link konfiguriranog vozila (bilo koji Nissan model / tržište) i klikni
      <b>Dohvati slike</b>. Aplikacija izdvaja linkove za eksterijer i 360° interijer.
    </p>
    <input
      id="urlInput"
      type="text"
      placeholder="https://www.nissan.de/vehicles/..."
    >
    <button id="scrapeBtn" onclick="scrape()">Dohvati slike</button>
    <div class="status" id="status"></div>
    <div id="results"></div>
  </div>

  <script>
    async function scrape() {
      const url = document.getElementById('urlInput').value.trim();
      const btn = document.getElementById('scrapeBtn');
      const status = document.getElementById('status');
      const results = document.getElementById('results');

      if (!url) {
        status.className = 'status error';
        status.textContent = '⚠️ Molim unesi link!';
        return;
      }

      btn.disabled = true;
      status.className = 'status';
      status.textContent = '⏳ Učitavam stranicu i tražim slike... (može potrajati 20-40s)';
      results.innerHTML = '';

      try {
        const res = await fetch('/scrape', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const text = await res.text();
        if (!text) {
          throw new Error('Server nije vratio odgovor (moguć restart zbog memorije). Pokušaj ponovno za nekoliko sekundi.');
        }

        let json;
        try {
          json = JSON.parse(text);
        } catch (parseErr) {
          throw new Error('Neispravan odgovor servera. Pokušaj ponovno.');
        }

        if (!json.success) {
          throw new Error(json.error || 'Nepoznata greška na serveru.');
        }

        render(json.data);
        status.className = 'status success';
        status.textContent = '✅ Pronađeno ukupno ' + json.data.total + ' slika.';
      } catch (e) {
        status.className = 'status error';
        status.textContent = '❌ Greška: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    }

    function render(data) {
      const results = document.getElementById('results');
      results.innerHTML = '';
      renderSection('🚙 Eksterijer 360°', data.exterior_360);
      renderSection('🛋️ Interijer (Pannellum)', data.interior_pannellum);
      renderSection('🖼️ Ostale slike', data.other_images);

      if (
        (!data.exterior_360 || data.exterior_360.length === 0) &&
        (!data.interior_pannellum || data.interior_pannellum.length === 0)
      ) {
        const div = document.createElement('div');
        div.className = 'section';
        div.innerHTML =
          '<p class="empty">Nisu pronađene glavne slike vozila. ' +
          'Provjeri je li link ispravan ili pokušaj ponovno.</p>';
        results.appendChild(div);
      }
    }

    function renderSection(title, links) {
      const results = document.getElementById('results');
      const div = document.createElement('div');
      div.className = 'section';

      let count = links ? links.length : 0;
      let html = '<h3>' + title + ' (' + count + ')</h3>';

      if (count === 0) {
        html += '<p class="empty">Nema rezultata u ovoj kategoriji.</p>';
        div.innerHTML = html;
        results.appendChild(div);
        return;
      }

      html +=
        '<button class="copy-all" onclick=\'copyAll(' +
        JSON.stringify(links) +
        ')\'>📋 Kopiraj sve linkove</button>';
      div.innerHTML = html;

      links.forEach(function (link) {
        const item = document.createElement('div');
        item.className = 'img-item';

        const a = document.createElement('a');
        a.href = link;
        a.target = '_blank';
        a.textContent = link;

        const group = document.createElement('div');
        group.className = 'btn-group';

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = 'Kopiraj';
        copyBtn.onclick = function () {
          copyOne(link, copyBtn);
        };

        const openBtn = document.createElement('button');
        openBtn.className = 'copy-btn';
        openBtn.textContent = 'Otvori';
        openBtn.onclick = function () {
          window.open(link, '_blank');
        };

        group.appendChild(copyBtn);
        group.appendChild(openBtn);

        item.appendChild(a);
        item.appendChild(group);
        div.appendChild(item);
      });

      results.appendChild(div);
    }

    function copyOne(text, btn) {
      navigator.clipboard.writeText(text).then(function () {
        const original = btn.textContent;
        btn.textContent = '✓ Kopirano';
        setTimeout(function () {
          btn.textContent = original;
        }, 1500);
      });
    }

    function copyAll(arr) {
      navigator.clipboard.writeText(arr.join('\n')).then(function () {
        alert('Kopirano ' + arr.length + ' linkova!');
      });
    }

    // Omogući Enter tipku za pokretanje
    document.getElementById('urlInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        scrape();
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nissan 360° Extractor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <svg class="logo" viewBox="0 0 240 64" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="30" fill="none" stroke="#ffffff" stroke-width="2.5"/>
        <rect x="2" y="26" width="60" height="12" fill="#c3002f"/>
        <text x="32" y="35" font-size="8.5" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif" letter-spacing="0.5">NISSAN</text>
        <text x="76" y="40" font-size="26" fill="#ffffff" font-weight="700" letter-spacing="3" font-family="Arial, sans-serif">NISSAN</text>
      </svg>
      <span class="header-title">360° <span>Extractor</span></span>
    </div>
  </header>

  <div class="main">
    <div class="hero">
      <h1>360° Image <span class="accent">Extractor</span></h1>
      <p>Zalijepi jedan ili više linkova (svaki u novi red) konfiguriranih vozila i automatski izvuci 360° eksterijer rotaciju i interijer panoramu.</p>
    </div>

    <div class="card">
      <textarea id="urlInput" rows="3" placeholder="Zalijepi link(ove) — svaki u novi red...&#10;https://www.nissan.de/fahrzeuge/...&#10;https://www.nissan.de/fahrzeuge/..."></textarea>
      <div class="input-actions">
        <span class="hint" id="linkCount">0 linkova</span>
        <div style="display:flex; gap:10px;">
          <button class="btn-secondary" id="toggleAllBtn" onclick="toggleAll()" style="display:none;">Skupi sve</button>
          <button class="btn" id="scrapeBtn" onclick="scrapeAll()">Dohvati slike</button>
        </div>
      </div>
      <div class="status" id="status"></div>
    </div>

    <div class="results" id="results"></div>
  </div>

  <footer class="footer">NISSAN 360° EXTRACTOR &middot; Interni alat</footer>

  <script>
    const urlInput = document.getElementById('urlInput');
    const linkCount = document.getElementById('linkCount');

    urlInput.addEventListener('input', function () {
      const links = getLinks();
      linkCount.textContent = links.length + (links.length === 1 ? ' link' : ' linkova');
    });

    function getLinks() {
      return urlInput.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    }

    async function scrapeAll() {
      const links = getLinks();
      const btn = document.getElementById('scrapeBtn');
      const results = document.getElementById('results');
      const toggleBtn = document.getElementById('toggleAllBtn');

      if (links.length === 0) {
        setStatus('error', '⚠️ Unesi barem jedan link!');
        return;
      }
      const invalid = links.filter(l => !l.toLowerCase().includes('nissan.'));
      if (invalid.length > 0) {
        setStatus('error', '⚠️ Neki linkovi ne izgledaju kao Nissan linkovi. Provjeri unos.');
        return;
      }

      btn.disabled = true;
      results.innerHTML = '';
      toggleBtn.style.display = 'none';

      for (let i = 0; i < links.length; i++) {
        const url = links[i];
        const prefix = links.length > 1 ? ('[' + (i + 1) + '/' + links.length + '] ') : '';

        setStatus('', '<span class="spinner"></span> ' + prefix + 'Otvaram stranicu...');
        await sleep(300);
        setStatus('', '<span class="spinner"></span> ' + prefix + 'Tražim 360° slike... (može potrajati)');

        try {
          const res = await fetch('/scrape', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url })
          });

          const text = await res.text();
          if (!text) throw new Error('Server nije vratio odgovor. Pokušaj ponovno.');

          let json;
          try { json = JSON.parse(text); }
          catch (e) { throw new Error('Neispravan odgovor servera.'); }

          if (!json.success) throw new Error(json.error || 'Nepoznata greška.');

          renderResult(url, json.data, links.length > 1 ? (i + 1) : null);
        } catch (e) {
          renderError(url, e.message, links.length > 1 ? (i + 1) : null);
        }
      }

      setStatus('success', '✅ Obrada završena (' + links.length + ' ' + (links.length === 1 ? 'link' : 'linkova') + ').');
      btn.disabled = false;
      toggleBtn.style.display = 'inline-block';
      toggleBtn.textContent = 'Skupi sve';
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function setStatus(cls, html) {
      const status = document.getElementById('status');
      status.className = 'status' + (cls ? ' ' + cls : '');
      status.innerHTML = html;
    }

    function toggleAll() {
      const sections = document.querySelectorAll('#results .section');
      const btn = document.getElementById('toggleAllBtn');
      const shouldCollapse = btn.textContent === 'Skupi sve';
      sections.forEach(function (s) {
        if (shouldCollapse) s.classList.add('collapsed');
        else s.classList.remove('collapsed');
      });
      btn.textContent = shouldCollapse ? 'Raširi sve' : 'Skupi sve';
    }

    function renderResult(url, data, index) {
      const results = document.getElementById('results');

      if (index) {
        const divider = document.createElement('div');
        divider.className = 'batch-divider';
        divider.textContent = 'Vozilo #' + index;
        results.appendChild(divider);
      }

      if (data.codes) renderInfoCard(data.codes);

      renderSection('🚙 Eksterijer 360° (rotacija)', data.exterior_rotation, true, true);
      renderSection('🛋️ Interijer (360° Panorama)', data.interior_pannellum, true, false);

      const noMain =
        (!data.exterior_rotation || data.exterior_rotation.length === 0) &&
        (!data.interior_pannellum || data.interior_pannellum.length === 0);

      if (noMain) {
        const div = document.createElement('div');
        div.className = 'section';
        div.innerHTML = '<div class="section-body"><p class="empty">Nisu pronađene slike. Provjeri je li link IRIS konfigurator (Qashqai/X-Trail/Leaf).</p></div>';
        results.appendChild(div);
      }
    }

    function renderError(url, msg, index) {
      const results = document.getElementById('results');
      const div = document.createElement('div');
      div.className = 'section';
      const label = index ? ('Vozilo #' + index + ' — ') : '';
      div.innerHTML = '<div class="section-body"><p class="empty" style="color:#c3002f">❌ ' + label + 'Greška: ' + msg + '</p></div>';
      results.appendChild(div);
    }

    function renderInfoCard(codes) {
      const results = document.getElementById('results');
      const hasCodes = codes.vehicle_code || codes.paint_code || codes.fabric_code;
      if (!hasCodes) return;

      const card = document.createElement('div');
      card.className = 'section info-card';

      let rows = '';
      if (codes.vehicle_code) rows += infoRow('Šifra vozila', '<span class="code-pill">' + codes.vehicle_code + '</span>');
      if (codes.paint_code) rows += infoRow('Šifra boje', '<span class="code-pill">' + codes.paint_code + '</span>');
      if (codes.fabric_code) rows += infoRow('Šifra interijera', '<span class="code-pill">' + codes.fabric_code + '</span>');

      const header = document.createElement('div');
      header.className = 'section-header clickable';
      header.innerHTML = '<h3><span class="toggle-arrow">▼</span> 📋 Šifre konfiguracije</h3>';

      const body = document.createElement('div');
      body.className = 'section-body';
      body.innerHTML = '<table class="info-table">' + rows + '</table>';

      header.onclick = function () { card.classList.toggle('collapsed'); };

      card.appendChild(header);
      card.appendChild(body);
      results.appendChild(card);
    }

    function infoRow(label, value) {
      return '<tr><td class="info-label">' + label + '</td><td class="info-value">' + value + '</td></tr>';
    }

    function renderSection(title, links, withPreview, collapsed) {
      const results = document.getElementById('results');
      const count = links ? links.length : 0;

      const section = document.createElement('div');
      section.className = 'section';

      const header = document.createElement('div');
      header.className = 'section-header clickable';

      const titleWrap = document.createElement('h3');
      titleWrap.innerHTML = '<span class="toggle-arrow">▼</span> ' + title + ' <span class="badge">' + count + '</span>';
      header.appendChild(titleWrap);

      const headerRight = document.createElement('div');
      headerRight.style.display = 'flex';
      headerRight.style.gap = '10px';
      headerRight.style.alignItems = 'center';

      if (count > 0) {
        const copyAllBtn = document.createElement('button');
        copyAllBtn.className = 'copy-all';
        copyAllBtn.textContent = '📋 Kopiraj sve';
        copyAllBtn.onclick = function (e) {
          e.stopPropagation();
          copyAll(links);
        };
        headerRight.appendChild(copyAllBtn);
      }
      header.appendChild(headerRight);

      section.appendChild(header);

      const body = document.createElement('div');
      body.className = 'section-body';

      if (count === 0) {
        body.innerHTML = '<p class="empty">Nema rezultata.</p>';
      } else {
        links.forEach(function (link) {
          const item = document.createElement('div');
          item.className = 'img-item';

          if (withPreview) {
            const thumb = document.createElement('img');
            thumb.className = 'thumb';
            thumb.src = link;
            thumb.loading = 'lazy';
            thumb.onerror = function () { thumb.style.display = 'none'; };
            item.appendChild(thumb);
          }

          const a = document.createElement('a');
          a.href = link;
          a.target = '_blank';
          a.className = 'img-link';
          a.textContent = link;

          const group = document.createElement('div');
          group.className = 'btn-group';

          const copyBtn = document.createElement('button');
          copyBtn.className = 'mini-btn';
          copyBtn.textContent = 'Kopiraj';
          copyBtn.onclick = function () { copyOne(link, copyBtn); };

          const dlBtn = document.createElement('button');
          dlBtn.className = 'mini-btn dl';
          dlBtn.textContent = '⬇ Skini';
          dlBtn.onclick = function () { downloadImage(link); };

          group.appendChild(copyBtn);
          group.appendChild(dlBtn);

          item.appendChild(a);
          item.appendChild(group);
          body.appendChild(item);
        });
      }

      section.appendChild(body);

      if (collapsed) {
        section.classList.add('collapsed');
      }
      header.onclick = function () {
        section.classList.toggle('collapsed');
      };

      results.appendChild(section);
    }

    function copyOne(text, btn) {
      navigator.clipboard.writeText(text).then(function () {
        const o = btn.textContent;
        btn.textContent = '✓';
        setTimeout(function () { btn.textContent = o; }, 1200);
      });
    }

    function copyAll(arr) {
      navigator.clipboard.writeText(arr.join('\n')).then(function () {
        alert('Kopirano ' + arr.length + ' linkova!');
      });
    }

    async function downloadImage(url) {
      try {
        const res = await fetch(url);
        const blob = await res.blob();
        const a = document.createElement('a');
        const objUrl = URL.createObjectURL(blob);
        a.href = objUrl;
        const povMatch = url.match(/pov=([^,&]+)/);
        const name = povMatch ? povMatch[1] : 'nissan-image';
        a.download = name + '.jpg';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(objUrl);
      } catch (e) {
        window.open(url, '_blank');
      }
    }
  </script>
</body>
</html>

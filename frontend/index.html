<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nissan Image Extractor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <svg class="logo" viewBox="0 0 240 64" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="30" fill="none" stroke="#ffffff" stroke-width="2.5"/>
        <rect x="2" y="26" width="60" height="12" fill="#c3002f"/>
        <text x="32" y="35" font-size="8.5" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif" letter-spacing="0.5">NISSAN</text>
        <text x="76" y="40" font-size="26" fill="#ffffff" font-weight="700" letter-spacing="3" font-family="Arial, sans-serif">NISSAN</text>
      </svg>
      <span class="header-title">Image <span>Extractor</span></span>
    </div>
  </header>

  <div class="main">
    <div class="hero">
      <h1>360° Image <span class="accent">Extractor</span></h1>
      <p>Zalijepi link konfiguriranog vozila (bilo koji Nissan model ili tržište) i automatski izvuci linkove za eksterijer i 360° interijer panoramu.</p>
    </div>

    <div class="card">
      <div class="input-row">
        <input id="urlInput" type="text" placeholder="https://www.nissan.de/vehicles/...">
        <button class="btn" id="scrapeBtn" onclick="scrape()">Dohvati slike</button>
      </div>
      <div class="status" id="status"></div>
    </div>

    <div class="results" id="results"></div>
  </div>

  <footer class="footer">NISSAN IMAGE EXTRACTOR &middot; Interni alat</footer>

  <script>
    async function scrape() {
      const url = document.getElementById('urlInput').value.trim();
      const btn = document.getElementById('scrapeBtn');
      const status = document.getElementById('status');
      const results = document.getElementById('results');

      if (!url) {
        status.className = 'status error';
        status.textContent = '⚠️ Molim unesi link!';
        return;
      }

      btn.disabled = true;
      status.className = 'status';
      status.innerHTML = '<span class="spinner"></span> Učitavam stranicu i tražim slike... (20-40s)';
      results.innerHTML = '';

      try {
        const res = await fetch('/scrape', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const text = await res.text();
        if (!text) {
          throw new Error('Server nije vratio odgovor (moguć restart zbog memorije). Pokušaj ponovno za nekoliko sekundi.');
        }

        let json;
        try {
          json = JSON.parse(text);
        } catch (parseErr) {
          throw new Error('Neispravan odgovor servera. Pokušaj ponovno.');
        }

        if (!json.success) {
          throw new Error(json.error || 'Nepoznata greška na serveru.');
        }

        render(json.data);
        status.className = 'status success';
        status.textContent = '✅ Pronađeno ukupno ' + json.data.total + ' izvornih slika.';
      } catch (e) {
        status.className = 'status error';
        status.textContent = '❌ Greška: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    }

    function render(data) {
      const results = document.getElementById('results');
      results.innerHTML = '';

      if (data.vehicle_info) {
        renderInfoCard(data.vehicle_info, data.codes);
      }

      renderSection('🚙 Eksterijer 360°', data.exterior_360);
      renderSection('🛋️ Interijer (360° Panorama)', data.interior_pannellum);
      renderSection('🖼️ Ostale slike', data.other_images);

      const noMain =
        (!data.exterior_360 || data.exterior_360.length === 0) &&
        (!data.interior_pannellum || data.interior_pannellum.length === 0);

      if (noMain) {
        const div = document.createElement('div');
        div.className = 'section';
        div.innerHTML = '<div class="section-body"><p class="empty">Nisu pronađene glavne slike vozila. Provjeri link ili pokušaj ponovno.</p></div>';
        results.appendChild(div);
      }
    }

    function renderInfoCard(info, codes) {
      const results = document.getElementById('results');
      const card = document.createElement('div');
      card.className = 'section info-card';

      let rows = '';
      if (info.model) rows += infoRow('Model', info.model);
      if (info.grade) rows += infoRow('Verzija', info.grade);
      if (info.price) rows += infoRow('Cijena', info.price);

      if (codes) {
        if (codes.paint_code) rows += infoRow('Šifra boje', '<span class="code-pill">' + codes.paint_code + '</span>');
        if (codes.fabric_code) rows += infoRow('Šifra interijera', '<span class="code-pill">' + codes.fabric_code + '</span>');
      }

      if (!rows) return;

      card.innerHTML =
        '<div class="section-header"><h3>📋 Konfiguracija vozila</h3></div>' +
        '<div class="section-body"><table class="info-table">' + rows + '</table></div>';
      results.appendChild(card);
    }

    function infoRow(label, value) {
      return '<tr><td class="info-label">' + label + '</td><td class="info-value">' + value + '</td></tr>';
    }

    function renderSection(title, links) {
      const results = document.getElementById('results');
      const count = links ? links.length : 0;

      const section = document.createElement('div');
      section.className = 'section';

      const header = document.createElement('div');
      header.className = 'section-header';
      header.innerHTML = '<h3>' + title + ' <span class="badge">' + count + '</span></h3>';

      if (count > 0) {
        const copyAllBtn = document.createElement('button');
        copyAllBtn.className = 'copy-all';
        copyAllBtn.textContent = '📋 Kopiraj sve';
        copyAllBtn.onclick = function () { copyAll(links); };
        header.appendChild(copyAllBtn);
      }

      section.appendChild(header);

      const body = document.createElement('div');
      body.className = 'section-body';

      if (count === 0) {
        body.innerHTML = '<p class="empty">Nema rezultata u ovoj kategoriji.</p>';
        section.appendChild(body);
        results.appendChild(section);
        return;
      }

      links.forEach(function (link) {
        const item = document.createElement('div');
        item.className = 'img-item';

        const a = document.createElement('a');
        a.href = link;
        a.target = '_blank';
        a.className = 'img-link';
        a.textContent = link;

        const group = document.createElement('div');
        group.className = 'btn-group';

        const copyBtn = document.createElement('button');
        copyBtn.className = 'mini-btn';
        copyBtn.textContent = 'Kopiraj';
        copyBtn.onclick = function () { copyOne(link, copyBtn); };

        const openBtn = document.createElement('button');
        openBtn.className = 'mini-btn';
        openBtn.textContent = 'Otvori';
        openBtn.onclick = function () { window.open(link, '_blank'); };

        group.appendChild(copyBtn);
        group.appendChild(openBtn);

        item.appendChild(a);
        item.appendChild(group);
        body.appendChild(item);
      });

      section.appendChild(body);
      results.appendChild(section);
    }

    function copyOne(text, btn) {
      navigator.clipboard.writeText(text).then(function () {
        const original = btn.textContent;
        btn.textContent = '✓ Kopirano';
        setTimeout(function () { btn.textContent = original; }, 1500);
      });
    }

    function copyAll(arr) {
      navigator.clipboard.writeText(arr.join('\n')).then(function () {
        alert('Kopirano ' + arr.length + ' linkova!');
      });
    }

    document.getElementById('urlInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') { scrape(); }
    });
  </script>
</body>
</html>

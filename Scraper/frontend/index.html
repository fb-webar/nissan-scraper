<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nissan Image Extractor</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #f4f4f4; margin: 0; padding: 40px; color: #1a1a1a; }
    .container { max-width: 900px; margin: 0 auto; background: #fff;
                 padding: 32px; border-radius: 12px; box-shadow: 0 2px 20px rgba(0,0,0,0.08); }
    h1 { color: #c3002f; font-size: 24px; }
    input { width: 100%; padding: 14px; font-size: 15px; border: 2px solid #ddd;
            border-radius: 8px; margin: 12px 0; }
    button { background: #c3002f; color: #fff; border: none; padding: 14px 28px;
             font-size: 15px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    button:hover { background: #a00026; }
    button:disabled { background: #999; cursor: not-allowed; }
    .section { margin-top: 24px; }
    .section h3 { border-bottom: 2px solid #eee; padding-bottom: 8px; }
    .img-item { display: flex; align-items: center; justify-content: space-between;
                padding: 8px; background: #fafafa; border-radius: 6px; margin: 6px 0;
                font-size: 13px; word-break: break-all; }
    .img-item a { color: #0066cc; text-decoration: none; }
    .copy-btn { background: #333; padding: 6px 12px; font-size: 12px; margin-left: 10px; }
    .status { margin-top: 16px; font-style: italic; color: #666; }
    .copy-all { background: #0066cc; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚗 Nissan Image Extractor</h1>
    <p>Zalijepi link konfiguriranog vozila i klikni <b>Dohvati slike</b>.</p>
    <input id="urlInput" type="text" placeholder="https://www.nissan.de/fahrzeuge/...">
    <button id="scrapeBtn" onclick="scrape()">Dohvati slike</button>
    <div class="status" id="status"></div>
    <div id="results"></div>
  </div>

  <script>
    async function scrape() {
      const url = document.getElementById('urlInput').value.trim();
      const btn = document.getElementById('scrapeBtn');
      const status = document.getElementById('status');
      const results = document.getElementById('results');
      if (!url) { alert('Unesi link!'); return; }

      btn.disabled = true;
      status.textContent = '⏳ Učitavam stranicu i tražim slike... (može potrajati 15-30s)';
      results.innerHTML = '';

      try {
        const res = await fetch('/scrape', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        render(json.data);
        status.textContent = `✅ Pronađeno ukupno ${json.data.total} slika.`;
      } catch (e) {
        status.textContent = '❌ Greška: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    }

    function render(data) {
      const results = document.getElementById('results');
      results.innerHTML = '';
      renderSection('🚙 Eksterijer 360°', data.exterior_360);
      renderSection('🛋️ Interijer (Pannellum)', data.interior_pannellum);
      renderSection('🖼️ Ostale slike', data.other_images);
    }

    function renderSection(title, links) {
      if (!links || links.length === 0) return;
      const results = document.getElementById('results');
      const div = document.createElement('div');
      div.className = 'section';
      div.innerHTML = `<h3>${title} (${links.length})</h3>
        <button class="copy-all" onclick='copyAll(${JSON.stringify(links)})'>📋 Kopiraj sve linkove</button>`;
      links.forEach(link => {
        const item = document.createElement('div');
        item.className = 'img-item';
        item.innerHTML = `<a href="${link}" target="_blank">${link}</a>
          <button class="copy-btn" onclick="copyOne('${link}')">Kopiraj</button>`;
        div.appendChild(item);
      });
      results.appendChild(div);
    }

    function copyOne(text) { navigator.clipboard.writeText(text); }
    function copyAll(arr) { navigator.clipboard.writeText(arr.join('\n')); alert('Kopirano ' + arr.length + ' linkova!'); }
  </script>
</body>
</html>
